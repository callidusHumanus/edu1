<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Edu 1 Admin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="robots" content="noindex,nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Manrope:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout concept: a dark control room. A tilting glass sign-in card opens onto a stats strip, a filter bar
   and a list of applicants; each row opens a full-height detail sheet that swings in from the right. */
:root{
  --bg:#050816;--ink:#f1f5ff;--mute:#9fb0d3;--line:rgba(160,200,255,.16);--glass:rgba(11,20,46,.72);
  --a:#35c8ff;--b:#a58bff;--c:#ff6b9a;--d:#4cf0b0;--y:#ffc53d;--warn:#ff8a9b;
  --grad:linear-gradient(110deg,var(--a),var(--b) 50%,var(--c));
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:400 15px/1.5 var(--f-body);
  background:radial-gradient(60% 40% at 15% 0%,rgba(165,139,255,.18),transparent 70%),radial-gradient(50% 40% at 90% 10%,rgba(53,200,255,.16),transparent 70%),var(--bg);
  background-attachment:fixed;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
[hidden]{display:none!important}
.glass{background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.wrap{max-width:1100px;margin:0 auto;padding-block:18px 60px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:14px;padding:12px 18px;font:700 .8rem/1 var(--f-display);color:#050816;background:var(--grad);transition:transform .2s,opacity .2s}
.btn:hover{transform:translateY(-2px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--warn)}
.btn.danger.arm{background:var(--warn);color:#050816}
.btn.sm{padding:10px 14px;font-size:.72rem}
.btn[disabled]{opacity:.6;cursor:wait}
.logo{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--grad);color:#050816;font:900 13px/1 var(--f-display)}
input[type=text],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:rgba(4,10,28,.75)}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--a);box-shadow:0 0 0 4px rgba(53,200,255,.15)}
select{appearance:none;padding-right:34px;background-image:linear-gradient(45deg,transparent 50%,var(--mute) 50%),linear-gradient(135deg,var(--mute) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 12px) 50%;background-size:6px 6px;background-repeat:no-repeat}

/* login */
.login{min-height:100vh;display:grid;place-items:center;perspective:1400px;padding-block:24px}
.lcard{width:min(100%,420px);padding:30px 26px;border-radius:28px;transform-style:preserve-3d;transition:transform .2s ease-out;animation:flip .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes flip{from{opacity:0;transform:perspective(1400px) rotateX(60deg) translateY(60px) translateZ(-200px)}to{opacity:1;transform:none}}
.lcard .logo{width:48px;height:48px;border-radius:16px;font-size:16px;margin-bottom:18px;transform:translateZ(40px);box-shadow:0 14px 34px -10px var(--b)}
.lcard h1{margin:0 0 6px;font:800 1.5rem/1.15 var(--f-display);transform:translateZ(26px)}
.lcard p{margin:0 0 20px;color:var(--mute);transform:translateZ(14px)}
.lcard form{display:grid;gap:14px}
.lcard label{display:grid;gap:6px;font:700 .82rem/1.2 var(--f-body)}
.msg{min-height:1.3em;color:var(--warn);font-size:.88rem;font-weight:600}
.setup{max-width:560px;margin:10vh auto;padding:26px;border-radius:24px}
.setup code{font:500 .85em var(--f-mono);background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px}

/* app */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px}
.brand b{display:block;font:800 1.05rem/1.1 var(--f-display)}
.brand small{display:block;color:var(--mute);font:500 11px/1.4 var(--f-mono);letter-spacing:.06em;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px;perspective:1000px}
.stat{padding:16px 18px;border-radius:20px;transition:transform .25s}
.stat:hover{transform:rotateX(8deg) translateY(-3px)}
.stat span{display:block;color:var(--mute);font:500 11px/1 var(--f-mono);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.stat b{font:800 1.8rem/1 var(--f-display);font-variant-numeric:tabular-nums}
.tools{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px;margin-bottom:16px}
.list{display:grid;gap:10px;perspective:1400px}
.row{display:grid;grid-template-columns:44px minmax(0,1.4fr) minmax(0,1fr) auto auto;gap:14px;align-items:center;width:100%;text-align:left;padding:14px 16px;border-radius:20px;transition:transform .3s,border-color .3s,box-shadow .3s;animation:rowin .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes rowin{from{opacity:0;transform:rotateX(40deg) translateY(30px) translateZ(-80px)}to{opacity:1;transform:none}}
.row:hover{transform:translateY(-3px) rotateX(3deg);border-color:var(--a);box-shadow:0 22px 40px -26px var(--a)}
.av{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:800 14px/1 var(--f-display);color:#050816;background:var(--grad)}
.nm b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nm span{display:block;color:var(--mute);font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:4px 9px;border-radius:999px;font:600 11px/1.2 var(--f-body);background:rgba(255,255,255,.07);border:1px solid var(--line)}
.score{font:800 .95rem/1 var(--f-display);font-variant-numeric:tabular-nums;padding:8px 11px;border-radius:12px;background:rgba(255,255,255,.06)}
.score.hi{color:var(--d)}.score.mid{color:var(--y)}.score.lo{color:var(--warn)}
.pill{padding:6px 11px;border-radius:999px;font:700 11px/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor}
.s-New{color:var(--a)}.s-Shortlisted{color:var(--y)}.s-Interview{color:var(--b)}.s-Accepted{color:var(--d)}.s-Rejected{color:var(--warn)}
.empty{padding:40px 20px;text-align:center;color:var(--mute);border-radius:24px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(2,4,14,.6);backdrop-filter:blur(4px);z-index:20;animation:fade .3s both}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(100%,640px);z-index:21;overflow-y:auto;overscroll-behavior:contain;padding:22px 22px 40px;padding-top:max(22px,env(safe-area-inset-top,0px));background:#070d24;border-left:1px solid var(--line);transform-origin:right center;animation:swing .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes swing{from{opacity:0;transform:perspective(1600px) rotateY(-55deg) translateX(80px)}to{opacity:1;transform:none}}
.sheet h2{margin:0 0 4px;font:800 1.4rem/1.15 var(--f-display);overflow-wrap:anywhere}
.sheet .sub{color:var(--mute);margin:0 0 18px;font:500 12px/1.4 var(--f-mono);overflow-wrap:anywhere}
.sh-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.sec{margin-top:22px}
.sec h3{margin:0 0 10px;font:500 11px/1 var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--a)}
.kv{display:grid;grid-template-columns:130px minmax(0,1fr);gap:8px 14px;font-size:.93rem}
.kv span{color:var(--mute)}.kv b{font-weight:600;overflow-wrap:anywhere}
.kv a{color:var(--a);text-decoration:underline}
.qa{display:flex;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.04);margin-bottom:8px;font-size:.9rem;align-items:flex-start}
.qa i{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:800 11px/1 var(--f-display);font-style:normal;color:#050816}
.qa.ok i{background:var(--d)}.qa.no i{background:var(--warn)}
.qa em{display:block;color:var(--mute);font-style:normal;font-size:.82rem}
.essay{padding:14px 16px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--line);margin-bottom:10px}
.essay b{display:block;margin-bottom:6px}
.essay p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;color:#d6e2fa}
.sh-acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
textarea{min-height:90px;resize:vertical}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;padding:12px 18px;border-radius:14px;background:#0f1a3d;border:1px solid var(--line);font-weight:700;font-size:.88rem;animation:fade .3s both}
@media (max-width:760px){
  .tools{grid-template-columns:1fr 1fr}.tools input{grid-column:1/-1}
  .row{grid-template-columns:44px minmax(0,1fr) auto;grid-template-areas:"av nm sc" "av ch st"}
  .row .av{grid-area:av;align-self:start}.row .nm{grid-area:nm}.row .chips{grid-area:ch}.row .score{grid-area:sc}.row .pill{grid-area:st;justify-self:end}
  .kv{grid-template-columns:100px minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

[hidden]{display:none!important}
img{max-width:100%}
</style>
</head>
<body>

<div id="setup" class="setup glass" hidden>
  <h1 style="font:800 1.3rem/1.2 var(--f-display);margin:0 0 10px">Connect your database</h1>
  <p>Open <code>admin.html</code> in a text editor and fill in the two lines near the top of the script: <code>url</code> (your Supabase Project URL) and <code>key</code> (your anon public key). Then upload the file again.</p>
</div>

<div id="login" class="login" hidden>
  <div class="lcard glass" id="lcard">
    <div class="logo">E1</div>
    <h1>Admin sign in</h1>
    <p>Beta tester applications. Authorised staff only.</p>
    <form id="lform" novalidate>
      <label>Email<input id="lemail" type="email" autocomplete="username" required></label>
      <label>Password<input id="lpass" type="password" autocomplete="current-password" required></label>
      <div class="msg" id="lmsg" role="alert"></div>
      <button class="btn" id="lbtn" type="submit">Sign in</button>
    </form>
  </div>
</div>

<div id="app" class="wrap" hidden>
  <div class="top">
    <div class="brand"><div class="logo">E1</div><div><b>Applications</b><small id="who"></small></div></div>
    <div class="acts">
      <button class="btn ghost sm" id="refresh" type="button">Refresh</button>
      <button class="btn ghost sm" id="csv" type="button">Export CSV</button>
      <button class="btn ghost sm" id="out" type="button">Sign out</button>
    </div>
  </div>
  <div class="stats" id="stats"></div>
  <div class="tools">
    <input id="q" type="search" placeholder="Search name, email, school" aria-label="Search">
    <select id="fs" aria-label="Status"><option value="">All statuses</option><option>New</option><option>Shortlisted</option><option>Interview</option><option>Accepted</option><option>Rejected</option></select>
    <select id="fj" aria-label="Subject"><option value="">All subjects</option><option>Chemistry</option><option>Physics</option><option>Biology</option></select>
    <select id="so" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="score">Highest score</option><option value="name">Name A to Z</option></select>
  </div>
  <div class="list" id="list"></div>
</div>
<div id="sheetHost"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script>
(function(){
'use strict';
var CFG={
  url:'',   /* paste your Supabase Project URL between the quotes, e.g. https://abcd1234.supabase.co */
  key:''    /* paste your Supabase anon public key between the quotes */
};
if(window.EDU1_CONFIG){CFG.url=window.EDU1_CONFIG.url;CFG.key=window.EDU1_CONFIG.key}
var STATUS=['New','Shortlisted','Interview','Accepted','Rejected'];
var $=function(s){return document.querySelector(s)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var sb=null,rows=[],toastT;
function toast(m){var o=$('.toast');if(o)o.remove();var t=el('div','toast',m);document.body.appendChild(t);clearTimeout(toastT);toastT=setTimeout(function(){t.remove()},2600)}

if(!CFG.url||!CFG.key||!window.supabase){$('#setup').hidden=false;if(CFG.url&&!window.supabase)$('#setup p').textContent='The database library could not load. Check your internet connection and reload.';return}
sb=window.supabase.createClient(CFG.url,CFG.key);

/* ---------- auth ---------- */
function showLogin(){$('#app').hidden=true;$('#login').hidden=false;closeSheet()}
function showApp(user){$('#login').hidden=true;$('#app').hidden=false;$('#who').textContent=user&&user.email?user.email:'';load()}
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)showApp(r.data.session.user);else showLogin()});
sb.auth.onAuthStateChange(function(ev,s){if(ev==='SIGNED_OUT')showLogin()});
$('#lform').addEventListener('submit',function(e){
  e.preventDefault();var b=$('#lbtn'),m=$('#lmsg');m.textContent='';
  var em=$('#lemail').value.trim(),pw=$('#lpass').value;
  if(!em||!pw){m.textContent='Enter your email and password.';return}
  b.disabled=true;b.textContent='Signing in...';
  sb.auth.signInWithPassword({email:em,password:pw}).then(function(r){
    b.disabled=false;b.textContent='Sign in';
    if(r.error){m.textContent=r.error.message==='Invalid login credentials'?'Wrong email or password.':r.error.message;return}
    $('#lpass').value='';showApp(r.data.user);
  });
});
$('#out').addEventListener('click',function(){sb.auth.signOut()});
(function(){var c=$('#lcard');c.addEventListener('pointermove',function(e){if(e.pointerType==='touch')return;var r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform='perspective(1000px) rotateY('+(x*12)+'deg) rotateX('+(-y*12)+'deg)'});c.addEventListener('pointerleave',function(){c.style.transform=''})})();

/* ---------- data ---------- */
function load(){
  $('#list').replaceChildren(el('div','empty glass','Loading applications...'));
  sb.from('applications').select('*').order('created_at',{ascending:false}).then(function(r){
    if(r.error){$('#list').replaceChildren(el('div','empty glass','Could not load applications: '+r.error.message));return}
    rows=r.data||[];render();
  });
}
$('#refresh').addEventListener('click',function(){load();toast('Refreshed')});
['q','fs','fj','so'].forEach(function(id){$('#'+id).addEventListener('input',render)});

function initials(n){var p=String(n||'?').trim().split(/\s+/);return ((p[0]||'?')[0]+(p.length>1?p[p.length-1][0]:'')).toUpperCase()}
function fmt(d){try{return new Date(d).toLocaleString([], {dateStyle:'medium',timeStyle:'short'})}catch(e){return d}}
function cls(r){var p=r.total?r.score/r.total:0;return p>=.75?'hi':p>=.5?'mid':'lo'}
function filtered(){
  var q=$('#q').value.trim().toLowerCase(),fs=$('#fs').value,fj=$('#fj').value,so=$('#so').value;
  var out=rows.filter(function(r){
    if(fs&&r.status!==fs)return false;
    if(fj&&String(r.subjects||'').indexOf(fj)<0)return false;
    if(q&&[r.name,r.email,r.school,r.phone,r.place,r.course].join(' ').toLowerCase().indexOf(q)<0)return false;
    return true;
  });
  out.sort(function(a,b){
    if(so==='old')return new Date(a.created_at)-new Date(b.created_at);
    if(so==='score')return (b.score||0)-(a.score||0)||new Date(b.created_at)-new Date(a.created_at);
    if(so==='name')return String(a.name||'').localeCompare(String(b.name||''));
    return new Date(b.created_at)-new Date(a.created_at);
  });
  return out;
}
function render(){
  var tot=rows.length,nw=rows.filter(function(r){return r.status==='New'}).length,
      sl=rows.filter(function(r){return r.status==='Shortlisted'||r.status==='Interview'||r.status==='Accepted'}).length,
      avg=tot?(rows.reduce(function(s,r){return s+(r.total?r.score/r.total:0)},0)/tot*100):0;
  var st=$('#stats');st.replaceChildren();
  [['Total',tot],['New',nw],['In progress',sl],['Avg score',Math.round(avg)+'%']].forEach(function(x){var d=el('div','stat glass');d.appendChild(el('span',null,x[0]));d.appendChild(el('b',null,String(x[1])));st.appendChild(d)});
  var L=$('#list'),f=filtered();L.replaceChildren();
  if(!f.length){L.appendChild(el('div','empty glass',rows.length?'No applications match your filters.':'No applications yet. They will appear here as soon as someone applies.'));return}
  f.forEach(function(r,i){
    var b=el('button','row glass');b.type='button';b.style.animationDelay=Math.min(i,12)*45+'ms';
    b.appendChild(el('div','av',initials(r.name)));
    var nm=el('div','nm');nm.appendChild(el('b',null,r.name||'Unnamed'));nm.appendChild(el('span',null,(r.school||'')+(r.level?' · '+r.level:'')));b.appendChild(nm);
    var ch=el('div','chips');String(r.subjects||'').split(',').forEach(function(s){s=s.trim();if(s)ch.appendChild(el('span','chip',s))});b.appendChild(ch);
    b.appendChild(el('div','score '+cls(r),(r.score==null?'-':r.score)+'/'+(r.total||'-')));
    b.appendChild(el('div','pill s-'+r.status,r.status));
    b.addEventListener('click',function(){openSheet(r.id)});
    L.appendChild(b);
  });
}

/* ---------- detail sheet ---------- */
function closeSheet(){$('#sheetHost').replaceChildren()}
function kv(box,k,v,link){box.appendChild(el('span',null,k));var b=el('b');if(link&&v){var a=el('a',null,v);a.href=link;b.appendChild(a)}else b.textContent=v||'-';box.appendChild(b)}
function openSheet(id){
  var r=rows.filter(function(x){return x.id===id})[0];if(!r)return;
  var host=$('#sheetHost');host.replaceChildren();
  var scrim=el('div','scrim');scrim.addEventListener('click',closeSheet);host.appendChild(scrim);
  var s=el('aside','sheet');s.setAttribute('role','dialog');s.setAttribute('aria-label','Application detail');host.appendChild(s);
  var top=el('div','sh-top'),hd=el('div');hd.appendChild(el('h2',null,r.name||'Unnamed'));hd.appendChild(el('div','sub','Ref '+r.ref+' · '+fmt(r.created_at)));top.appendChild(hd);
  var x=el('button','btn ghost sm','Close');x.type='button';x.addEventListener('click',closeSheet);top.appendChild(x);s.appendChild(top);

  var sec=el('div','sec');sec.appendChild(el('h3',null,'Decision'));
  var sel=el('select');sel.setAttribute('aria-label','Status');STATUS.forEach(function(o){var op=el('option',null,o);if(o===r.status)op.selected=true;sel.appendChild(op)});
  sel.addEventListener('change',function(){sel.disabled=true;sb.from('applications').update({status:sel.value}).eq('id',r.id).select().then(function(u){sel.disabled=false;if(u.error||!u.data||!u.data.length){sel.value=r.status;toast('Could not save status');return}r.status=sel.value;toast('Status saved');render()})});
  sec.appendChild(sel);s.appendChild(sec);

  var c=el('div','sec');c.appendChild(el('h3',null,'Contact'));var g=el('div','kv');
  kv(g,'Email',r.email,r.email?'mailto:'+r.email:'');kv(g,'Phone / WhatsApp',r.phone,r.phone?'tel:'+String(r.phone).replace(/[^+\d]/g,''):'');kv(g,'Location',r.place);c.appendChild(g);s.appendChild(c);

  var e=el('div','sec');e.appendChild(el('h3',null,'Eligibility'));g=el('div','kv');
  kv(g,'Institution',r.school);kv(g,'Level',r.level);kv(g,'Course',r.course);kv(g,'Completes',r.grad);kv(g,'Subjects',r.subjects);kv(g,'Hours / week',r.hours);kv(g,'Device',r.device);e.appendChild(g);s.appendChild(e);

  var q=el('div','sec');q.appendChild(el('h3',null,'Quiz · '+(r.score==null?'-':r.score)+' of '+(r.total||'-')));
  (Array.isArray(r.quiz)?r.quiz:[]).forEach(function(it,i){
    var row=el('div','qa '+(it.ok?'ok':'no'));row.appendChild(el('i',null,it.ok?'✓':'✕'));
    var t=el('div');t.appendChild(document.createTextNode('Q'+(i+1)+'. '+it.q));var em=el('em',null,'Answered: '+it.pick+(it.ok?'':' · Correct: '+it.right));t.appendChild(em);row.appendChild(t);q.appendChild(row);
  });s.appendChild(q);

  var es=el('div','sec');es.appendChild(el('h3',null,'Essays'));
  (Array.isArray(r.essays)?r.essays:[]).forEach(function(it){var d=el('div','essay');d.appendChild(el('b',null,it.title||'Essay'));d.appendChild(el('p',null,it.answer||''));es.appendChild(d)});s.appendChild(es);

  var n=el('div','sec');n.appendChild(el('h3',null,'Your notes'));var ta=el('textarea');ta.value=r.notes||'';ta.placeholder='Private notes about this applicant';ta.setAttribute('aria-label','Notes');
  ta.addEventListener('blur',function(){if(ta.value===(r.notes||''))return;sb.from('applications').update({notes:ta.value}).eq('id',r.id).select().then(function(u){if(u.error||!u.data||!u.data.length){toast('Could not save notes');return}r.notes=ta.value;toast('Notes saved')})});
  n.appendChild(ta);s.appendChild(n);

  var a=el('div','sh-acts');
  if(r.pdf_path){var p=el('button','btn sm','Open PDF');p.type='button';p.addEventListener('click',function(){
    var w=window.open('','_blank');
    sb.storage.from('applications').createSignedUrl(r.pdf_path,300).then(function(u){
      if(u.error||!u.data){if(w)w.close();toast('Could not open PDF');return}
      if(w)w.location.href=u.data.signedUrl;else window.location.href=u.data.signedUrl;
    });
  });a.appendChild(p)}
  var del=el('button','btn danger sm','Delete');del.type='button';var arm=0;
  del.addEventListener('click',function(){
    if(!arm){arm=1;del.classList.add('arm');del.textContent='Tap again to confirm';setTimeout(function(){arm=0;del.classList.remove('arm');del.textContent='Delete'},4000);return}
    del.disabled=true;
    sb.from('applications').delete().eq('id',r.id).select().then(function(u){
      if(u.error||!u.data||!u.data.length){del.disabled=false;toast('Could not delete');return}
      if(r.pdf_path)sb.storage.from('applications').remove([r.pdf_path]);
      rows=rows.filter(function(z){return z.id!==r.id});closeSheet();render();toast('Deleted');
    });
  });a.appendChild(del);s.appendChild(a);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeSheet()});

/* ---------- csv ---------- */
function cell(v){v=v==null?'':String(v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
$('#csv').addEventListener('click',function(){
  var f=filtered();if(!f.length){toast('Nothing to export');return}
  var H=['Received','Reference','Status','Name','Email','Phone','Location','Institution','Level','Course','Completion year','Subjects','Hours per week','Device','Score','Total','Essay 1','Essay 2','Essay 3','Notes'];
  var lines=[H.map(cell).join(',')];
  f.forEach(function(r){var e=Array.isArray(r.essays)?r.essays:[];lines.push([r.created_at,r.ref,r.status,r.name,r.email,r.phone,r.place,r.school,r.level,r.course,r.grad,r.subjects,r.hours,r.device,r.score,r.total,(e[0]||{}).answer,(e[1]||{}).answer,(e[2]||{}).answer,r.notes].map(cell).join(','))});
  var blob=new Blob(['﻿'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'}),u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download='edu1-applications.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000);
});
})();
</script>
